 <button class="act" data-a="vcf" style="background:${p.a};color:#fff;border:0;font-weight:700">Enregistrer le contact</button><button class="act" data-a="wallet">Ajouter au Wallet</button>${S.vn?'<div class="note" style="font-size:.78rem">Démonstration : l\'enregistrement automatique du contact sera actif sur la version finale hébergée de votre carte digitale.</div>':''}${S.wallet?'<div class="note" style="font-size:.78rem">Simulation de démonstration : aucune intégration Apple Wallet ou Google Wallet n\'est réalisée.</div>':''}</div></div>`}
const pick=(arr,key,render)=>`<div class="grid" role="radiogroup">${arr.map((o,k)=>`<button class="opt" role="radio" aria-checked="${S[key]==k}" data-a="set" data-k="${key}" data-v="${k}">${render(o,k)}<span>${o.n}</span></button>`).join('')}</div>`;

const swatch=o=>`<div class="sw"><i style="background:${o.a}"></i><i style="background:${o.d}"></i><i style="background:${o.b}"></i></div>`;
function lockup(){const p=P(),i=S.info,t=(a,b,bg,c)=>`<div style="background:${bg};color:${c};border-radius:12px;padding:18px;text-align:center">${mark(S.logo,84,a,b)}<div style="font:700 1rem Georgia,serif;margin-top:6px">${esc(i.name)}</div><div style="font-size:.72rem;opacity:.7">${esc(i.act)}</div></div>`;
 return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">${t(p.a,p.b,'#fff','#1d1d1f')}${t(p.b,'#fff',p.d,'#fff')}</div>`}
/* ============ ÉTAPES ============ */
const VIEWS=[
()=>`<div class="hero dark"><div><div class="pvwrap">${paves()}</div><h1>${S.info.boss?esc(S.info.boss.split(' ')[0])+', votre':'Votre'} ${MOT} est prête à ${TAUX}.</h1><p>Carte de visite, logo, signature e-mail, devis et facture : tout est déjà rempli avec les informations de votre entreprise. Il ne vous reste qu'à ajouter votre téléphone et votre adresse.</p><div class="chips"><span>Simple</span><span>Rapide</span><span>Efficace</span><span>Livraison offerte</span><span>Factures aux mentions e-facture 2026</span></div></div><div class="stage">${cardHTML('f')}${cardHTML('b')}</div></div>`,
()=>`<h2>Choisissez votre logo</h2><p>Des modèles adaptés à votre métier. L'aperçu de votre carte se met à jour en haut de l'écran.</p>${pick(LOGOS,'logo',(o,k)=>mark(k,84))}<div class="panel">${cardFlip()}</div>`,
()=>`<h2>Choisissez vos couleurs</h2><p>Chaque palette s'applique à votre logo, votre carte, votre signature et vos devis.</p>${pick(PALS,'pal',swatch)}<div class="panel">${cardFlip()}</div>`,
()=>`<h2>Choisissez le style de carte</h2>${pick(STYLES,'style',(o,k)=>stylePrev(k))}<div class="panel">${cardFlip()}</div>`,
()=>`<h2>Votre signature email</h2>${pick(SIGS,'sig',o=>`<div style="height:40px;display:grid;place-items:center;font:600 .75rem ${o.ff}">${o.bar=='l'?'▍':o.bar=='t'?'▔':o.bar=='b'?'▁':'·'} Aa</div>`)}${sigHTML(1)}`,
()=>`<h2>Devis et facture</h2>${pick(DOCS,'doc',(o)=>`<div style="height:40px;font:600 .75rem ${o.ff};display:grid;place-items:center">Aa</div>`)}<div class="tabs" role="tablist">${['Devis','Facture'].map(t=>`<button class="btn" role="tab" aria-selected="${S.tab==t}" data-a="tab" data-v="${t}" style="${S.tab==t?'background:var(--ink);color:#fff':''}">${t}</button>`).join('')}<button class="btn" data-a="zoom" data-v="-.1" aria-label="Zoom arrière">−</button><button class="btn" data-a="zoom" data-v="0">Ajuster</button><button class="btn" data-a="zoom" data-v=".1" aria-label="Zoom avant">+</button></div><div class="dw" id="dw"><div>${docHTML()}</div></div>`,
()=>`<h2>Informations de l'entreprise</h2><p>Chaque modification est reportée dans tous les supports.</p><div class="two"><div>${FIELDS.map(f=>`<label>${f[1]}<input data-f="${f[0]}" value="${esc(S.info[f[0]])}" placeholder="À compléter"></label>`).join('')}</div><div class="panel" id="pv">${cardFlip()}</div></div>`,
()=>S.ordered?`<h2>Démonstration terminée</h2><div class="note"><b>Cette commande est une démonstration.</b> Aucun paiement n'a été effectué et aucune commande réelle n'a été enregistrée.</div><p>Votre commande comprendrait 100 cartes de visite livrées à domicile, puis le logo, la signature e-mail et les devis envoyés par e-mail.</p><button class="btn" data-a="back">Retour au récapitulatif</button>`:
 `<h2>Récapitulatif</h2><p>Voici votre carte de visite, prête à être imprimée.</p><div class="panel" style="margin-bottom:18px">${cardFlip()}</div><h3>Votre logo</h3><div class="panel" style="text-align:center;margin-bottom:18px">${mark(S.logo,110)}<div style="font:700 1.1rem Georgia,serif;margin-top:6px">${esc(S.info.name)}</div></div><h3>Votre signature e-mail</h3><div style="margin-bottom:18px">${sigHTML()}</div><h3>Vos devis et factures</h3><div class="tabs" role="tablist">${['Devis','Facture'].map(t=>`<button class="btn" role="tab" aria-selected="${S.tab==t}" data-a="tab" data-v="${t}" style="${S.tab==t?'background:var(--ink);color:#fff':''}">${t}</button>`).join('')}</div><div class="dw" id="dw" style="margin-bottom:18px"><div>${docHTML()}</div></div><table class="tbl"><tr><td>Logo</td><td><b>${LOGOS[S.logo].n}</b></td></tr><tr><td>Palette</td><td><b>${P().n}</b></td></tr><tr><td>Style de carte</td><td><b>${STYLES[S.style].n}</b></td></tr><tr><td>Signature</td><td><b>${SIGS[S.sig].n}</b></td></tr><tr><td>Devis / facture</td><td><b>${DOCS[S.doc].n}</b></td></tr><tr><td>Supports inclus</td><td>Carte de visite, signature email, devis, facture</td></tr><tr><td>Envoyé par courrier</td><td><b>100 cartes de visite</b> livrées à votre domicile, <b>livraison offerte</b></td></tr><tr><td>Envoyé par e-mail</td><td>Logo, signature e-mail, devis et factures aux nouvelles mentions obligatoires de la facturation électronique, en format modifiable, offerts</td></tr></table>
 <div class="gift"><b>Par courrier :</b> vos 100 cartes de visite, imprimées et livrées à votre domicile, <b>livraison offerte</b>.<br><b>Par e-mail, en format numérique :</b> votre logo, votre signature e-mail, vos modèles de devis et de facture (avec les nouvelles mentions obligatoires de la facturation électronique), offerts.</div><div style="margin:22px 0"><div class="price">${PRICE}</div><p>Paiement unique. Sans abonnement. Sans engagement.</p><p>Pour toute quantité supplémentaire de cartes de visite, écrivez-nous à <a href="mailto:${esc(CONTACT)}">${esc(CONTACT)}</a>.</p></div><label style="display:flex;gap:8px;font-weight:400;margin:0 0 12px"><input type="checkbox" id="cgv" ${S.cgv?'checked':''} style="width:auto;margin-top:3px"><span>J'ai lu et j'accepte les ${CGV_URL?`<a href="${esc(CGV_URL)}" target="_blank" rel="noopener">`:'<a href="#" data-a="cgv">'}conditions générales de vente</a>.</span></label><a class="btn p${S.cgv?'':' off'}" href="${S.cgv?stripeUrl():'#'}" data-pay="${esc(stripeUrl())}" aria-disabled="${!S.cgv}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Commander : ${MOT} — ${PRICE}</a><p style="margin-top:12px;font-size:.85rem">Le paiement se fait sur la page sécurisée Stripe.</p>${CONTACT?`<div class="contactcard"><div class="cc-brand">${REEF_LOGO}</div><b>Une question ?</b>${CONTACT.includes('@')?`<span>Notre équipe vous répond par e-mail : ${esc(CONTACT)}</span><div class="cc-btns"><a class="pill red" href="mailto:${esc(CONTACT)}">Nous écrire</a></div>`:`<span>Notre équipe vous répond au ${esc(CONTACT)}</span><div class="cc-btns"><a class="pill red" href="tel:${telH()}">Appeler</a><a class="pill line" href="sms:${telH()}">Envoyer un SMS</a></div>`}</div>`:''}<p class="legal">reef Studio Pro · ${esc(CONTACT||'')} · <a href="#" data-a="cgv">Conditions générales de vente</a></p>`,
];

/* ============ RENDU & ÉVÉNEMENTS ============ */
const okTel=()=>S.info.phone.replace(/\D/g,'').length>=10;
const okAdr=()=>S.info.street.trim().length>2&&S.info.city.trim().length>2;
function closeM(){const m=document.getElementById('md');if(m)m.remove()}
function showM(x){closeM();const m=document.createElement('div');m.className='modal';m.id='md';m.setAttribute('role','alertdialog');m.setAttribute('aria-modal','true');m.innerHTML='<div>'+x+'</div>';document.body.appendChild(m)}
function guard(t){if(t<7)return true;
 if(!okTel()){showM('<h3>Numéro de téléphone obligatoire</h3><p>Il apparaît sur votre carte de visite, votre signature et vos devis. Sans lui, vos 100 cartes seraient imprimées sans moyen de vous joindre.</p><button class="btn p" data-a="mphone">Renseigner mon téléphone</button>');return false}
 if(!okAdr()){showM('<h3>Adresse postale obligatoire</h3><p>C\'est l\'adresse où vos 100 cartes de visite seront livrées, et elle figure au dos de votre carte.</p><button class="btn p" data-a="mphone">Renseigner mon adresse</button>');return false}
 const m=[];if(!S.info.email)m.push('votre e-mail');if(!S.info.site)m.push('votre site internet');
 if(m.length&&!S.warned){showM('<h3>Il vous manque des informations</h3><p>Vous n\'avez pas renseigné '+m.join(' ni ')+'. Vous pouvez continuer : ils n\'apparaîtront simplement pas sur vos supports.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="mphone">Compléter</button><button class="btn p" data-a="mcont">Continuer quand même</button></div>');return false}
 return true}
const PROG=[90,92,94,96,97,98,99,100];
function updProg(){S.max=Math.max(S.max||0,S.step);const p=PROG[Math.min(S.max,PROG.length-1)],r=STEPS.length-1-S.step;$('#ppct').textContent=p+' %';$('#pbar').style.width=p+'%';$('#ptrack').setAttribute('aria-valuenow',p);$('#prest').textContent=r>1?'Plus que '+r+' étapes':r==1?'Dernière étape avant la commande':'Il ne reste qu\'à commander'}
function render(){updProg();$('#nav').innerHTML=STEPS.map((t,k)=>`<button data-a="go" data-v="${k}" ${k==S.step?'aria-current="step"':''}>${k+1}. ${t}</button>`).join('');
 $('#view').innerHTML=VIEWS[S.step]();const v=$('#view');v.className='';
 const LV={1:['.panel'],2:['.panel'],3:['.panel'],4:['.mail'],5:['.tabs','.dw'],6:['#pv']}[S.step];
 if(LV){const lv=document.createElement('div'),op=document.createElement('div');lv.className='live';op.className='opts';LV.forEach(q=>{const e=v.querySelector(q);if(e)lv.appendChild(e)});while(v.firstChild)op.appendChild(v.firstChild);v.append(lv,op);v.className='split'}
 document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');$('#prev').disabled=S.step==0;document.querySelector('.foot').classList.toggle('first',S.step==0);$('#next').disabled=S.step==STEPS.length-1;fitDoc();
 const c=$('#nav [aria-current]');if(c)c.scrollIntoView({inline:'center',block:'nearest'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='mclose'){closeM();return}else if(a=='express'){track('telle_quelle');S.express=1;S.step=6;scrollTo(0,0)}else if(a=='modif'){track('modifier');S.express=0;S.step=1;scrollTo(0,0)}else if(a=='cgv'){e.preventDefault();showM(CGV_HTML);return}else if(a=='mphone'){closeM();S.step=6;render();setTimeout(()=>{const k=!okTel()?'phone':!okAdr()?(S.info.street.trim().length>2?'city':'street'):(['email','site'].find(k=>!S.info[k])||'phone');const i=document.querySelector('[data-f='+k+']');if(i)i.focus()},60);return}else if(a=='mcont'){closeM();S.warned=1;S.step=7;render();scrollTo(0,0);return}else if(a=='go'){if(!guard(+v))return;S.step=+v;scrollTo(0,0)}else if(a=='set')S[b.dataset.k]=+v;else if(a=='tab')S.tab=v;
 else if(a=='zoom')S.z=v==0?1:Math.max(.4,Math.min(2,S.z+ +v));
 else if(a=='flip'){S.fl=S.fl?0:1;$('#cd').classList.toggle('fl',!!S.fl);b.setAttribute('aria-pressed',!!S.fl);return}
 else if(a=='vcf'){if(window.claude){S.vn=1;render();return}const u=URL.createObjectURL(new Blob([vcf()],{type:'text/vcard'})),l=document.createElement('a');l.href=u;l.download='contact.vcf';l.click();setTimeout(()=>URL.revokeObjectURL(u),500);return}
 else if(a=='wallet')S.wallet=1;else if(a=='order')S.ordered=1;else if(a=='back')S.ordered=0;
 render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;S.info[f]=e.target.value;$('#pv').innerHTML=cardFlip()});
document.addEventListener('change',e=>{if(e.target.id!='cgv')return;S.cgv=e.target.checked;const a=document.querySelector('a.btn.p[data-pay]');if(a){a.classList.toggle('off',!S.cgv);a.href=S.cgv?a.dataset.pay:'#';a.setAttribute('aria-disabled',String(!S.cgv))}});
document.addEventListener('click',e=>{const a=e.target.closest('a.btn.p');if(a){if(!S.cgv){e.preventDefault();showM('<h3>Une dernière étape</h3><p>Merci d\'accepter les conditions générales de vente avant de payer.</p><button class="btn p" data-a="mclose">Compris</button>')}}},true);
$('#prev').onclick=()=>{S.step=(S.express&&S.step==6)?0:Math.max(0,S.step-1);render();scrollTo(0,0)};
$('#next').onclick=()=>{const t=Math.min(STEPS.length-1,S.step+1);if(!guard(t))return;S.step=t;render();scrollTo(0,0)};
addEventListener('resize',fitDoc);
render();track('page_ouverte');
document.addEventListener('pointermove',e=>{const s=document.querySelector('.stage');if(!s)return;const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;s.style.transform='perspective(900px) rotateY('+x*12+'deg) rotateX('+(-y*9)+'deg)'});
</script>
</body>
</html>
