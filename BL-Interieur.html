function copyMail(b){const ok=()=>{b.textContent='Adresse copiée ✓'};try{navigator.clipboard.writeText(GMAIL).then(ok,()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('gmail'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Maintenez pour copier'})}catch(x){}}

()=>`<div class="hero dark"><div><div class="cmd"><span>Votre commande</span><b>100 cartes de visite premium</b><small>Recto verso, imprimées et livrées chez vous. Livraison offerte.</small></div><h1>On modernise votre image. Vos cartes de visite sont incluses.</h1><p>100 cartes de visite premium, imprimées recto verso et livrées chez vous, déjà remplies avec votre logo et les informations de votre entreprise. Vérifiez-les et validez votre carte avant de payer.</p><div class="pvwrap">${paves()}</div><div class="chips"><span>Simple</span><span>Rapide</span><span>Efficace</span><span>Livraison offerte</span><span>Recto verso</span></div></div><div class="stage">${cardHTML('f')}${cardHTML('b')}</div></div>`,
()=>`<h2>Choisissez votre logo</h2><p>Des modèles adaptés à votre métier. L'aperçu de votre carte se met à jour en haut de l'écran.</p>${pick(LOGOS,'logo',(o,k)=>mark(k,84))}<div class="panel">${cardFlip()}</div>`,

()=>S.ordered?`<h2>Démonstration terminée</h2><div class="note"><b>Cette commande est une démonstration.</b> Aucun paiement n'a été effectué et aucune commande réelle n'a été enregistrée.</div><p>Votre commande comprendrait 100 cartes de visite livrées à domicile, puis le logo et la signature e-mail envoyés par e-mail.</p><button class="btn" data-a="back">Retour au récapitulatif</button>`:
 `<h2>Récapitulatif</h2><p>Voici votre carte de visite, prête à être imprimée.</p><div class="panel" style="margin-bottom:18px">${cardFlip()}</div><h3>Votre logo</h3><div class="panel" style="text-align:center;margin-bottom:18px">${mark(S.logo,110)}<div style="font:700 1.1rem Georgia,serif;margin-top:6px">${esc(S.info.name)}</div></div><h3>Votre signature e-mail</h3><div style="margin-bottom:18px">${sigHTML()}</div><table class="tbl"><tr><td>Logo</td><td><b>${LOGOS[S.logo].n}</b></td></tr><tr><td>Palette</td><td><b>${P().n}</b></td></tr><tr><td>Style de carte</td><td><b>${STYLES[S.style].n}</b></td></tr><tr><td>Signature</td><td><b>${SIGS[S.sig].n}</b></td></tr><tr><td>Votre offre</td><td><b>Logo personnalisé + 100 cartes de visite premium recto verso + signature e-mail professionnelle</b></td></tr>${S.google?'<tr><td>Option Google</td><td><b>Votre visuel ajouté à votre fiche Google · +20 € TTC</b></td></tr>':''}<tr><td>Envoyé par courrier</td><td><b>100 cartes de visite</b> livrées à votre domicile, <b>livraison offerte</b></td></tr><tr><td>Envoyé par e-mail</td><td>Votre logo en fichiers, et en bonus offerts : votre signature e-mail</td></tr></table>
 <div class="gift"><b>Par courrier :</b> vos 100 cartes de visite, imprimées et livrées à votre domicile, <b>livraison offerte</b>.<br><b>Par e-mail, en format numérique :</b> votre logo, et en bonus offerts votre signature e-mail.<br><b>Vous voyez et validez votre carte avant de payer.</b></div>${optionCard()}<div style="margin:22px 0"><div class="price">${curPrice()}</div>${S.google?'<p>Offre principale 59 € TTC + option fiche Google 20 € TTC.</p>':''}<p>Paiement unique. Sans abonnement. Sans engagement.</p><p>Pour toute quantité supplémentaire de cartes de visite, écrivez-nous à <a href="mailto:${esc(CONTACT)}">${esc(CONTACT)}</a>.</p></div><label style="display:flex;gap:8px;font-weight:400;margin:0 0 12px"><input type="checkbox" id="cgv" ${S.cgv?'checked':''} style="width:auto;margin-top:3px"><span>J'ai lu et j'accepte les ${CGV_URL?`<a href="${esc(CGV_URL)}" target="_blank" rel="noopener">`:'<a href="#" data-a="cgv">'}conditions générales de vente</a>.</span></label><a class="btn p${S.cgv?'':' off'}" href="${S.cgv?stripeUrl():'#'}" data-pay="${esc(stripeUrl())}" aria-disabled="${!S.cgv}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Commander : ${MOT}${S.google?' + option Google':''} — ${curPrice()}</a><p style="margin-top:12px;font-size:.85rem">Le paiement se fait sur la page sécurisée Stripe.</p>${S.google?`<div class="gnext"><b>Option Google :</b> après votre commande, une étape simple vous explique comment nous inviter à gérer votre fiche.<br><button class="btn" data-a="go" data-v="7">Voir l’étape accès Google</button></div>`:''}${CONTACT?`<div class="contactcard"><div class="cc-brand">${REEF_LOGO}</div><b>Une question ?</b>${CONTACT.includes('@')?`<span>Notre équipe vous répond par e-mail : ${esc(CONTACT)}<br>ou par téléphone au ${CONTACT_TEL}</span><div class="cc-btns"><a class="pill red" href="tel:+33662493558">Appeler le ${CONTACT_TEL}</a><a class="pill line" href="mailto:${esc(CONTACT)}">Nous écrire</a></div>`:`<span> const okTel=()=>S.info.phone.replace(/\D/g,'').length>=10;
const okAdr=()=>S.info.street.trim().length>2&&S.info.city.trim().length>2;
function closeM(){const m=document.getElementById('md');if(m)m.remove()}
function showM(x){closeM();const m=document.createElement('div');m.className='modal';m.id='md';m.setAttribute('role','alertdialog');m.setAttribute('aria-modal','true');m.innerHTML='<div>'+x+'</div>';document.body.appendChild(m)}
function guard(t){if(t<6)return true;
 if(!okTel()){showM('<h3>Numéro de téléphone obligatoire</h3><p>Il apparaît sur votre carte de visite et votre signature e-mail. Sans lui, vos 100 cartes seraient imprimées sans moyen de vous joindre.</p><button class="btn p" data-a="mphone">Renseigner mon téléphone</button>');return false}
 if(!okAdr()){showM('<h3>Adresse postale obligatoire</h3><p>C\'est l\'adresse où vos 100 cartes de visite seront livrées, et elle figure au dos de votre carte.</p><button class="btn p" data-a="mphone">Renseigner mon adresse</button>');return false}
 const m=[];if(!S.info.email)m.push('votre e-mail');if(!S.info.site)m.push('votre site internet');
 if(m.length&&!S.warned){showM('<h3>Il vous manque des informations</h3><p>Vous n\'avez pas renseigné '+m.join(' ni ')+'. Vous pouvez continuer : ils n\'apparaîtront simplement pas sur vos supports.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="mphone">Compléter</button><button class="btn p" data-a="mcont">Continuer quand même</button></div>');return false}
 return true}
const PROG=[90,92,94,96,98,99,100,100];
function updProg(){S.max=Math.max(S.max||0,S.step);const p=PROG[Math.min(S.max,PROG.length-1)],r=Math.max(0,STEPS_BASE.length-1-S.step);$('#ppct').textContent=p+' %';$('#pbar').style.width=p+'%';$('#ptrack').setAttribute('aria-valuenow',p);$('#prest').textContent=r>1?'Plus que '+r+' étapes':r==1?'Dernière étape avant la commande':'Il ne reste qu\'à commander'}
function render(){STEPS=S.google?[...STEPS_BASE,'Accès Google']:STEPS_BASE.slice();updProg();document.documentElement.style.setProperty('--hg',P().a+'66');document.documentElement.style.setProperty('--hg2',P().a+'24');$('#nav').innerHTML=STEPS.map((t,k)=>`<button data-a="go" data-v="${k}" ${k==S.step?'aria-current="step"':''}>${k+1}. ${t}</button>`).join('');
 $('#view').innerHTML=VIEWS[S.step]();const v=$('#view');v.className='';
 const LV={1:['.panel'],2:['.panel'],3:['.panel'],4:['.mail'],5:['#pv']}[S.step];
 if(LV){const lv=document.createElement('div'),op=document.createElement('div');lv.className='live';op.className='opts';LV.forEach(q=>{const e=v.querySelector(q);if(e)lv.appendChild(e)});while(v.firstChild)op.appendChild(v.firstChild);v.append(lv,op);v.className='split'}
 document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');$('#prev').disabled=S.step==0;document.querySelector('.foot').classList.toggle('first',S.step==0);$('#next').disabled=S.step==STEPS.length-1;
 const c=$('#nav [aria-current]');if(c)c.scrollIntoView({inline:'center',block:'nearest'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='copymail'){copyMail(b);return}else if(a=='mclose'){closeM();return}else if(a=='express'){track('telle_quelle');S.express=1;S.step=5;scrollTo(0,0)}else if(a=='modif'){track('modifier');S.express=0;S.step=1;scrollTo(0,0)}else if(a=='cgv'){e.preventDefault();showM(CGV_HTML);return}else if(a=='mphone'){closeM();S.step=5;render();setTimeout(()=>{const k=!okTel()?'phone':!okAdr()?(S.info.street.trim().length>2?'city':'street'):(['email','site'].find(k=>!S.info[k])||'phone');const i=document.querySelector('[data-f='+k+']');if(i)i.focus()},60);return}else if(a=='mcont'){closeM();S.warned=1;S.step=6;render();scrollTo(0,0);return}else if(a=='go'){if(!guard(+v))return;S.step=+v;scrollTo(0,0)}else if(a=='set')S[b.dataset.k]=+v;
 else if(a=='flip'){S.fl=S.fl?0:1;$('#cd').classList.toggle('fl',!!S.fl);b.setAttribute('aria-pressed',!!S.fl);return}
 else if(a=='vcf'){if(window.claude){S.vn=1;render();return}const u=URL.createObjectURL(new Blob([vcf()],{type:'text/vcard'})),l=document.createElement('a');l.href=u;l.download='contact.vcf';l.click();setTimeout(()=>URL.revokeObjectURL(u),500);return}
 else if(a=='wallet')S.wallet=1;else if(a=='order')S.ordered=1;else if(a=='back')S.ordered=0;
 render()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;S.info[f]=e.target.value;$('#pv').innerHTML=cardFlip()});
document.addEventListener('change',e=>{if(e.target.id=='gopt'){S.google=e.target.checked?1:0;render();return}if(e.target.id!='cgv')return;S.cgv=e.target.checked;const a=document.querySelector('a.btn.p[data-pay]');if(a){a.classList.toggle('off',!S.cgv);a.href=S.cgv?a.dataset.pay:'#';a.setAttribute('aria-disabled',String(!S.cgv))}});
document.addEventListener('click',e=>{const a=e.target.closest('a.btn.p');if(a){if(!S.cgv){e.preventDefault();showM('<h3>Une dernière étape</h3><p>Merci d\'accepter les conditions générales de vente avant de payer.</p><button class="btn p" data-a="mclose">Compris</button>')}}},true);
$('#prev').onclick=()=>{S.step=(S.express&&S.step==5)?0:Math.max(0,S.step-1);render();scrollTo(0,0)};
$('#next').onclick=()=>{const t=Math.min(STEPS.length-1,S.step+1);if(!guard(t))return;S.step=t;render();scrollTo(0,0)};
{const H=location.hash.replace('#','');if(H=='merci'||H=='apercu-merci'||H=='apercu-merci-google'){if(H=='apercu-merci-google'&&GOOGLE_OPTION)S.google=1;showThanks(H!='merci');track('page_merci')}else{render();track('page_ouverte')}}
