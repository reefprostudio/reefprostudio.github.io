 document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');$('#prev').disabled=S.step==0;document.querySelector('.foot').classList.toggle('first',S.step==0);$('#next').disabled=S.step==STEPS.length-1;

{const H=location.hash.replace('#','');if(H=='merci'||H=='apercu-merci'||H=='apercu-merci-google'){if(H=='apercu-merci-google'&&GOOGLE_OPTION)S.google=1;showThanks(H!='merci');track('page_merci')}else{render();track('page_ouverte')}}
