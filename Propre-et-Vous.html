const okTel=()=>S.info.phone.replace(/\D/g,'').length>=10;
const okAdr=()=>S.info.street.trim().length>2&&S.info.city.trim().length>2;

function guard(t){if(t<6)return true;

 if(!okAdr()){showM('<h3>Adresse postale obligatoire</h3><p>C\'est l\'adresse où vos 100 cartes de visite seront livrées, et elle figure au dos de votre carte.</p><button class="btn p" data-a="mphone">Renseigner mon adresse</button>');return false}
 const m=[];if(!S.info.email)m.push('votre e-mail');if(!S.info.site)m.push('votre site internet');
 if(m.length&&!S.warned){showM('<h3>Il vous manque des informations</h3><p>Vous n\'avez pas renseigné '+m.join(' ni ')+'. Vous pouvez continuer : ils n\'apparaîtront simplement pas sur vos supports.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="mphone">Compléter</button><button class="btn p" data-a="mcont">Continuer quand même</button></div>');return false}

 $('#view').innerHTML=VIEWS[S.step]();const v=$('#view');v.className='';

 document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');$('#prev').disabled=S.step==0;document.querySelector('.foot').classList.toggle('first',S.step==0);$('#next').disabled=S.step==STEPS.length-1;

 if(a=='copymail'){copyMail(b);return}else if(a=='mclose'){closeM();return}else if(a=='express'){track('telle_quelle');S.express=1;S.step=5;scrollTo(0,0)}else if(a=='modif'){track('modifier');S.express=0;S.step=1;scrollTo(0,0)}else if(a=='cgv'){e.preventDefault();showM(CGV_HTML);return}else if(a=='mphone'){closeM();S.step=5;render();setTimeout(()=>{const k=!okTel()?'phone':!okAdr()?(S.info.street.trim().length>2?'city':'street'):(['email','site'].find(k=>!S.info[k])||'phone');const i=document.querySelector('[data-f='+k+']');if(i)i.focus()},60);return}else if(a=='mcont'){closeM();S.warned=1;S.step=6;render();scrollTo(0,0);return}else if(a=='go'){if(!guard(+v))return;S.step=+v;scrollTo(0,0)}else if(a=='set')S[b.dataset.k]=+v;
 else if(a=='flip'){S.fl=S.fl?0:1;$('#cd').classList.toggle('fl',!!S.fl);b.setAttribute('aria-pressed',!!S.fl);return}

 else if(a=='wallet')S.wallet=1;else if(a=='order')S.ordered=1;else if(a=='back')S.ordered=0;
 render()});

{const H=location.hash.replace('#','');if(H=='merci'||H=='apercu-merci'||H=='apercu-merci-google'){if(H=='apercu-merci-google'&&GOOGLE_OPTION)S.google=1;showThanks(H!='merci');track('page_merci')}else{render();track('page_ouverte')}}
